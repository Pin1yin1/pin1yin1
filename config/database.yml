development:
  adapter: mysql2
  encoding: utf8mb4
  reconnect: false
  username: <%= ENV["RAILS_DEVELOPMENT_USERNAME"] %>
  password: <%= ENV["RAILS_DEVELOPMENT_PASSWORD"] %>
  pool: 5
  database: pin1yin1_development

test:
